name: Secret Inheritance Demo

on:
  workflow_dispatch:

jobs:
  show-secret:
    runs-on: ubuntu-latest
    outputs:
      forwarded-secret: ${{ steps.forward.outputs.secret }}

    steps:
      - name: Print masked secret
        run: |
          echo "Masked: ${{ secrets.TEST_SECRET }}"

      - name: Unmask and print secret
        run: |
          echo "::remove-mask::${{ secrets.TEST_SECRET }}"
          echo "Unmasked: ${{ secrets.TEST_SECRET }}"

      - name: Forward secret to next job
        id: forward
        run: |
          echo "secret=${{ secrets.TEST_SECRET }}" >> $GITHUB_OUTPUT

  use-secret:
    needs: show-secret
    runs-on: ubuntu-latest
    steps:
      - name: Print inherited secret from previous job
        run: |
          echo "Inherited: ${{ needs.show-secret.outputs.forwarded-secret }}"
