<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - Theatre Timeline</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .container {
            text-align: center;
            padding: 48px 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 420px;
            width: 100%;
        }
        
        .icon {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            color: #d32f2f;
        }
        
        h1 {
            color: #d32f2f;
            margin: 0 0 16px 0;
            font-size: 28px;
            font-weight: 600;
        }
        
        .message {
            color: #333;
            margin-bottom: 12px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .hint {
            color: #666;
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        .contact {
            color: #888;
            font-size: 13px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        a {
            color: #667eea;
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="none"/>
            <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/>
        </svg>
        <h1>Access Denied</h1>
        <p class="message" id="errorMessage">Your access link is invalid or has expired.</p>
        <p class="hint">This may happen if:</p>
        <ul style="text-align: left; color: #666; font-size: 14px; margin-bottom: 24px;">
            <li>The link has been revoked by an administrator</li>
            <li>You're using an old or outdated link</li>
            <li>The link was copied incorrectly</li>
        </ul>
        <p class="contact">
            If you believe this is an error, please contact your administrator for a new access link.
        </p>
    </div>
    <script>
        // Check for error message in URL params
        const params = new URLSearchParams(window.location.search);
        const reason = params.get('reason');
        if (reason) {
            document.getElementById('errorMessage').textContent = decodeURIComponent(reason);
        }
    </script>
</body>
</html>
